name: docker

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Get version
      id: "turn-version"
      shell: "bash"
      run: |
        echo PKG_VERSION=$(awk -F ' = ' '$1 ~ /version/ { gsub(/["]/, "", $2); printf("%s",$2) }' ./Cargo.toml) >> $GITHUB_OUTPUT
        
    - name: Build image
      run: |
            docker build . -t ghcr.io/turmsapp/turn:latest
            docker tag ghcr.io/turmsapp/turn:latest ghcr.io/turmsapp/turn:${{ steps.turn-version.outputs.PKG_VERSION }}

    - name: Publish images
      run: |
            docker push ghcr.io/turmsapp/turn:latest
            docker push ghcr.io/turmsapp/turn:${{ steps.turn-version.outputs.PKG_VERSION }}
